<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Pendant lights glowing above a dashboard table at night">
  <title>Hue Browser</title>
  <defs>
    <!-- Soft amber bloom used for the lit pendant lights -->
    <radialGradient id="lampGlow">
      <stop offset="0%" stop-color="#e8b072" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#d9975a" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#d9975a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="peachGlow">
      <stop offset="0%" stop-color="#e6b191" stop-opacity="0.7" />
      <stop offset="45%" stop-color="#d79a7e" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#d79a7e" stop-opacity="0" />
    </radialGradient>
    <!-- Cone of light falling from a lit shade onto the table below -->
    <linearGradient id="lightCone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8b072" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#e8b072" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="peachCone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6b191" stop-opacity="0.26" />
      <stop offset="100%" stop-color="#e6b191" stop-opacity="0" />
    </linearGradient>
  </defs>
  <!-- Dark indigo night background -->
  <rect width="1200" height="420" fill="#141a2e" />
  <rect y="250" width="1200" height="170" fill="#191f36" />
  <!-- Ceiling rail the pendants hang from -->
  <rect x="40" y="40" width="1120" height="7" rx="3" fill="#3c4468" />
  <!-- Unlit pendant, dusty indigo -->
  <g>
    <rect x="229" y="47" width="4" height="86" fill="#3c4468" />
    <path d="M231 128 L275 196 H187 Z" fill="#39416a" />
    <rect x="187" y="192" width="88" height="7" rx="3" fill="#4b5486" />
  </g>
  <!-- Lit pendant, warm lamp amber -->
  <g>
    <circle cx="471" cy="205" r="150" fill="url(#lampGlow)" />
    <path d="M431 178 L511 178 L551 380 H391 Z" fill="url(#lightCone)" />
    <rect x="469" y="47" width="4" height="66" fill="#3c4468" />
    <path d="M471 108 L515 176 H427 Z" fill="#5d5470" />
    <rect x="427" y="172" width="88" height="8" rx="4" fill="#e8b072" />
    <circle cx="471" cy="190" r="13" fill="#f0c489" />
  </g>
  <!-- Unlit pendant, soft teal -->
  <g>
    <rect x="725" y="47" width="4" height="86" fill="#3c4468" />
    <path d="M727 128 L771 196 H683 Z" fill="#2f5a5c" />
    <rect x="683" y="192" width="88" height="7" rx="3" fill="#4a8a86" />
  </g>
  <!-- Lit pendant, peach -->
  <g>
    <circle cx="967" cy="200" r="120" fill="url(#peachGlow)" />
    <path d="M927 178 L1007 178 L1039 366 H895 Z" fill="url(#peachCone)" />
    <rect x="965" y="47" width="4" height="66" fill="#3c4468" />
    <path d="M967 108 L1011 176 H923 Z" fill="#6b5465" />
    <rect x="923" y="172" width="88" height="8" rx="4" fill="#e6b191" />
    <circle cx="967" cy="190" r="11" fill="#eec5aa" />
  </g>
  <!-- Dashboard table listing the lights -->
  <g>
    <rect x="60" y="286" width="1080" height="98" rx="12" fill="#232a44" />
    <rect x="60" y="286" width="1080" height="34" rx="12" fill="#2b3353" />
    <rect x="60" y="308" width="1080" height="12" fill="#2b3353" />
    <!-- Column dividers -->
    <g fill="#141a2e">
      <rect x="354" y="286" width="2" height="98" />
      <rect x="650" y="286" width="2" height="98" />
      <rect x="946" y="286" width="2" height="98" />
    </g>
    <!-- Header labels -->
    <g fill="#8b93b8">
      <rect x="92" y="299" width="150" height="8" rx="4" />
      <rect x="386" y="299" width="112" height="8" rx="4" />
      <rect x="682" y="299" width="132" height="8" rx="4" />
      <rect x="978" y="299" width="96" height="8" rx="4" />
    </g>
    <!-- Row values, tinted to match each light above -->
    <rect x="92" y="345" width="190" height="9" rx="4" fill="#cfd4e8" />
    <rect x="386" y="345" width="160" height="9" rx="4" fill="#5a6291" />
    <rect x="682" y="345" width="110" height="9" rx="4" fill="#4a8a86" />
    <rect x="978" y="345" width="130" height="9" rx="4" fill="#e8b072" />
  </g>
</svg>
