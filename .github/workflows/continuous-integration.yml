name: Continuous integration
# Validate every pull request, and the default branch after merge.
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    name: Lint and build the application
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      # Match the Node version used for local development and in the image.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting and lint rules
        run: npm run lint
      - name: Test bridge connection helpers
        run: npm test
      # The build also type checks the project.
      - name: Build the application
        run: npm run build
      - name: Read the Playwright version
        id: playwright-version
        run: echo 'version='$(node -p "require('@playwright/test/package.json').version") >> "$GITHUB_OUTPUT"
      # Browser binaries are large, so cache them by Playwright version.
      - name: Restore cached Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Chromium for Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Run Playwright integration tests
        run: npx playwright test --forbid-only
      - name: Upload the Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
      - name: Upload Playwright failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
  container:
    name: Build the container image
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      # Confirm the image still builds. Publishing happens in the continuous
      # deployment workflow.
      - name: Build the container image without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
  documentation:
    name: Build the documentation site
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Confirm the documentation still builds. Publishing happens in the
      # continuous deployment workflow.
      - name: Build the documentation site
        run: npm run docs:build
