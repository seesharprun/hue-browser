name: Continuous deployment | Documentation
# Publish the documentation site for every commit that lands on the default branch.
on:
  push:
    branches: [main]
permissions:
  contents: read
  # Required for the deployment job to publish to GitHub Pages.
  pages: write
  id-token: write
# Allow one deployment at a time, and let a newer commit finish rather than
# cancelling it partway through a publish.
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    name: Build the documentation site
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Supplies the base path the site is served from, so links resolve
      # correctly under the repository subpath.
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6
      # Keep the app icon as the source; Blume discovers favicon.svg in public.
      - name: Copy the app icon for the documentation site
        run: npm run docs:prepare
      - name: Build the documentation site
        run: npm run docs:build
      # Blume writes the built site to dist.
      - name: Upload the built site as an artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    name: Deploy the documentation site
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
