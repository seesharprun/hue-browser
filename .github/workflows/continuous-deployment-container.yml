name: Continuous deployment for the container image
# Publish a new image for every commit that lands on the default branch.
on:
  push:
    branches: [main]
env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
jobs:
  publish:
    name: Build and publish the container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to push packages to the GitHub Container Registry.
      packages: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      # QEMU and Buildx provide the emulation needed for arm64 builds.
      - name: Set up QEMU for cross-architecture builds
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Sign in to the GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tag each image as latest and with its commit SHA, so a specific
      # build can always be pinned.
      - name: Determine image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
      # arm64 covers Raspberry Pi and Apple Silicon hosts.
      - name: Build and publish the multi-architecture image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
